<!DOCTYPE html>
<html lang="it">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Ferie & Permessi - Calendario</title>
        <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="css/common.css">
        <link rel="stylesheet" href="css/calendar.css">
    </head>

    <body>
        <div class="shell shell-calendar">
            <div class="cal-toolbar">
                    <div class="dp-wrap">
                    <button class="cal-nav-btn" onclick="shiftMonth(-1)" title="Mese precedente">&#8249;</button>
                    <select class="dp-sel dp-month" id="dpMonth" onchange="dpChange()">
                        <option value="0">Gennaio</option>
                        <option value="1">Febbraio</option>
                        <option value="2">Marzo</option>
                        <option value="3">Aprile</option>
                        <option value="4">Maggio</option>
                        <option value="5">Giugno</option>
                        <option value="6">Luglio</option>
                        <option value="7">Agosto</option>
                        <option value="8">Settembre</option>
                        <option value="9">Ottobre</option>
                        <option value="10">Novembre</option>
                        <option value="11">Dicembre</option>
                    </select>
                    <span class="dp-sep">/</span>
                    <select class="dp-sel dp-year" id="dpYear" onchange="dpChange()"></select>
                    <button class="dp-today" onclick="dpToday()">Oggi</button>
                    <button class="cal-nav-btn" onclick="shiftMonth(1)" title="Mese successivo">&#8250;</button>
                </div>
                <div class="legend">
                    <div class="legend-item">
                        <div class="legend-dot" style="background:var(--leave);"></div>
                        <span>Ferie</span>
                        <span class="legend-stat" id="legStatLeave"></span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-dot" style="background: var(--permit);"></div>
                        <span>Permesso</span>
                        <span class="legend-stat" id="legStatPermit"></span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-dot" style="background: var(--office);"></div>
                        <span>Sede</span>
                        <span class="legend-stat" id="legStatOffice"></span>
                    </div>
                </div>

            <div class="sel-bar">
                <span class="sel-bar-label" data-i18n="mode_label">Modalità</span>
                <button class="sel-mode-btn active" id="btnModeSingle" onclick="setSelMode('single')">
                    <span data-i18n="mode_single">&#9654; Singolo</span>
                </button>
                <button class="sel-mode-btn" id="btnModeRange" onclick="setSelMode('range')">
                    <span data-i18n="mode_range">&#8614; Intervallo</span>
                </button>
                <span class="range-hint" id="rangeHint">Seleziona il primo giorno</span>
                <button class="btn-cancel-multi" id="btnCancelMulti" onclick="cancelSelection()">Annulla</button>
                <button class="btn-apply-multi" id="btnApplyMulti" onclick="applyMulti()">Segna selezionati &#9658;</button>
            </div>

            <div class="cal-opts" style="margin-bottom:10px">
                <label class="cal-opt-toggle" id="togWe" onclick="toggleOptions('we')">
                    <span class="tog-ico">&#128467;</span>
                    <span data-i18n="incl_weekend">Includi Sab/Dom</span>
                </label>
                <label class="cal-opt-toggle on" id="togLeave" onclick="toggleOptions('leave')">
                    <span class="tog-ico">&#127881;</span>
                    <span data-i18n="excl_holidays">Escludi festivi</span>
                </label>
            </div>

            <div class="extra-country-row">
                <select id="extraCountry" onchange="addExtra(this.value)"></select>
                <span class="extra-chips" id="extraChips"></span>
            </div>
            </div>

            <div class="cal-grid">
                <div class="cal-wdays">
                    <div class="cal-wday">Lun</div>
                    <div class="cal-wday">Mar</div>
                    <div class="cal-wday">Mer</div>
                    <div class="cal-wday">Gio</div>
                    <div class="cal-wday">Ven</div>
                    <div class="cal-wday" style="color: rgba(244, 241, 235, 3);">Sab</div>
                    <div class="cal-wday" style="color: rgba(244, 241, 235, 3);">Dom</div>
                </div>
                <div class="cal-days" id="calDays"></div>
            </div>
        </div>

        <div class="overlay" id="ovl">
            <div class="modal">
                <div class="modal-title" id="mTitle">Segna giornata</div>
                <div class="modal-sub" id="mSub"></div>
                <div class="modal-existing" id="mExisting" style="display:none;"></div>
                <div class="type-row">
                    <button class="type-opt" id="opt-leave" onclick="pick('leave')">
                        <span class="ico">&#127804;</span>
                    Ferie</button>
                    <button class="type-opt" id="opt-permit" onclick="pick('permit')">
                        <span class="ico">&#9200;</span>
                    Permesso</button>
                    <button class="type-opt" id="opt-office" onclick="pick('office')">
                        <span class="ico">&#127970;</span>
                    In Sede</button>
                </div>
                <div class="qty-section" id="qtySec">
                    <div class="qty-label">Durata</div>
                    <div class="qty-row">
                        <button class="qty-btn active" id="qbWhole" onclick="setQty('whole')">&#9646; Intera</button>
                        <button class="qty-btn" id="qbHalf" onclick="setQty('half')">&#9651; Mezza</button>
                        <button class="qty-btn" id="qbHours" onclick="setQty('hours')">&#9711; Ore</button>
                    </div>
                    <div id="halfRow" class="half-row" style="display: none;">
                        <button class="half-btn active" id="hbMorning" onclick="setHalf('morning')">&#9728; Mattina</button>
                        <button class="half-btn" id="hbAfternoon" onclick="setHalf('afternoon')">&#9790; Pomeriggio</button>
                    </div>
                    <div id="hoursRow" class="hours-custom-row" style="display: none;">
                        <label>Numero ore</label>
                        <input type="number" class="hours-input" id="hoursInput" min="1" max="8" value="1">
                        <span style="font-size: .82rem;color: var(--muted);">/
                            <span id="hoursDayLabel">8</span>
                        h</span>
                    </div>
                    <div class="hours-note" id="hoursNote"></div> 
                </div>
                <div class="modal-btns">
                    <button class="btn btn-cancel" onclick="closeModal()">Anulla</button>
                    <button class="btn btn-del" id="btnDel">Rimuovi</button>
                    <button class="btn btn-save" id="btnSave">Salva</button>
                </div>
            </div>
        </div>
        
        <script type="module" src="js/calendar.js"></script>
        <script type="module" src="js/app-shell.js"></script>
    </body>
</html>
