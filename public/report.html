<!DOCTYPE html>
<html lang="it">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Ferie & Permessi - Report</title>
        <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="css/common.css">
        <link rel="stylesheet" href="css/report.css">
        <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    </head>
    <body>
        <div class="shell">
            <div class="report-controls">
                <div class="fg">
                    <label data-i18n="rpt_year_label">Anno</label>
                    <div class="year-grid" id="yearGrid"></div>
                </div>

                <div class="fg" style="flex: 1; min-width: 260px;">
                    <div class="month-grid" id="monthGrid"></div>

                    <div style="display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap;">
                        <button class="btn-months-all" id="btnMonthsAll" onclick="selAllMonths(true)" data-i18n="rpt_all">Tutti</button>
                        <button class="btn-months-all" id="btnMonthsNone" onclick="selAllMonths(false)" data-i18n="rpt_none">Nessuno</button> 
                    </div>
                </div>
                <div style="display: flex; gap: 8px; align-items: flex-end;flex-wrap: wrap;">
                    <button class="btn-run" onclick="buildReport()">
                        <span data-i18n="rpt_generate">&#9654; Genera</span>
                    </button>
                    <button class="btn-run btn-csv" onclick="doExcel()">&#11015; Excel</button>
                </div>
            </div>

            <div id="reportOut"></div>
        </div>

        <script type="module" src="js/report.js"></script>
        <script type="module" src="js/app-shell.js"></script>
    </body>
</html>
